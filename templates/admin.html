{% extends 'base.html' %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}
<h1>Admin Dashboard</h1>
<table>
    <thead>
        <tr>
            <th>User ID</th>
            <th>Username</th>
            <th>Password</th>
            <th>Role</th>
            <th>Profile Image</th>
            <th>Actions</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <form method="POST" enctype="multipart/form-data" action="{{ url_for('admin') }}">
                <td><input type="number" name="user_id" value="{{ user[0] }}" readonly></td>
                <td><input type="text" name="username" value="{{ user[1] }}" required></td>
                <td><button type="submit" name="reset_password">Reset Password</button></td>
                <td>
                    <select name="role" required>
                        <option value="user" {% if user[3]=='user' %}selected{% endif %}>User</option>
                        <option value="admin" {% if user[3]=='admin' %}selected{% endif %}>Admin</option>
                    </select>
                </td>
                <td>
                    <button type="submit" name="reset_image">Remove</button>
                    <input type="file" name="profile_image" accept="image/*">
                </td>
                <td>
                    <button type="submit">Update</button>
                </td>
                <td>
                    <button type="submit" name="delete_user" onclick="return confirm('Are you sure you want to delete this user?')">Delete user</button>
                </td>
            </form>
        </tr>
        {% endfor %}
        <!-- Add new user row -->
        <tr>
            <form method="POST" enctype="multipart/form-data" action="{{ url_for('admin') }}">
                <td><input type="text" value="New" readonly></td>
                <td><input type="text" name="new_username" required placeholder="Username"></td>
                <td><input type="password" name="new_password" required placeholder="Password"></td>
                <td>
                    <select name="new_role" required>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </td>
                <td>
                    <input type="file" name="new_profile_image" accept="image/*">
                </td>
                <td colspan="2">
                    <button type="submit" name="add_user">Create User</button>
                </td>
            </form>
        </tr>
    </tbody>
</table>

<div class="button-container">
    <a href="{{ url_for('menu') }}" class="main-menu-button">Return to Main Menu</a>
</div>
{% endblock %}
