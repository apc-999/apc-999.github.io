name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # STAGE 1: Code Quality
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Lint with flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
        
      - name: Check formatting with black
        run: |
          black --check src/ || echo "Formatting issues found"
        continue-on-error: true

  # STAGE 2: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run Bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-results.json || echo "Security issues found"
        continue-on-error: true
        
      - name: Check for vulnerabilities in dependencies
        run: |
          safety check -r requirements.txt || echo "Dependency vulnerabilities found"
        continue-on-error: true
        
      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results
          path: bandit-results.json

  # STAGE 3: Unit Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Initialize database
        run: |
          python -c "from src.main import init_db; init_db()"
          
      - name: Run tests
        run: |
          cd src && python -m unittest test.py
        continue-on-error: true

  # STAGE 4: Build
  build:
    name: Build Application
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Build Docker image
        run: |
          docker build -t issue-tracker:${{ github.sha }} .
          
      - name: Save Docker image
        run: |
          docker save issue-tracker:${{ github.sha }} > issue-tracker.tar
          
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: issue-tracker.tar

  # STAGE 5: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: staging
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          
      - name: Load Docker image
        run: |
          docker load < issue-tracker.tar
          
      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # For example:
          # - Deploy to a staging server
          # - Deploy to a test environment in the cloud
          echo "Deployed to staging environment"

  # STAGE 6: Integration Tests
  integration-tests:
    name: Run Integration Tests
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run integration tests
        run: |
          echo "Running integration tests against staging environment..."
          # Add your integration test commands here
          echo "Integration tests completed"
        continue-on-error: true

  # STAGE 7: Deploy to Production
  deploy-production:
    name: Deploy to Production
    needs: [integration-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          
      - name: Load Docker image
        run: |
          docker load < issue-tracker.tar
          
      - name: Deploy to production environment
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # For example:
          # - Deploy to a production server
          # - Deploy to a production environment in the cloud
          echo "Deployed to production environment"

  # STAGE 8: Post-Deployment Verification
  verify-deployment:
    name: Verify Deployment
    needs: [deploy-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment status
        run: |
          echo "Verifying deployment..."
          # Add your verification commands here
          # For example:
          # - Health checks
          # - Smoke tests
          echo "Deployment verified"