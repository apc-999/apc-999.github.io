name: Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    # This is a placeholder for your actual deployment steps
    # Replace with your actual deployment logic
    - name: Deploy to production
      run: |
        echo "Deploying application to production server"
        # Add your deployment commands here
        # Examples:
        # - rsync files to a server
        # - deploy to a cloud provider like AWS, GCP, or Azure
        # - use a deployment service like Heroku
        
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Build application
      run: |
        echo "Building application"
        # Add your build commands here if needed
        # For Python Flask apps, this might include:
        # - Compiling static assets
        # - Creating distribution packages
        
    - name: Run tests
      run: |
        pip install pytest
        pytest src/test.py